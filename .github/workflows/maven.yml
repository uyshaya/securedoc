# Java CI with Maven — runs unit tests, publishes JaCoCo coverage as a PR
# comment, and commits a coverage badge to .github/badges/jacoco.svg on push
# to main. Uses Oracle GraalVM 25 (the same toolchain prod builds against)
# so JVM-only test failures cannot mask issues that would surface only at
# native-image build time.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (GraalVM)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw -B clean install

      - name: Add coverage PR comment
        uses: Madrapps/jacoco-report@v1.6.1
        if: github.event_name == 'pull_request'
        with:
          paths: ${{ github.workspace }}/target/jacoco-report/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60
          title: 'Code Coverage Report'

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v4

      - name: Generate JaCoCo badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/jacoco-report/jacoco.csv
          badges-directory: .github/badges
          coverage-label: Coverage

      - name: Commit the badge (if it changed)
        # Only push the regenerated badge on merges/pushes to main — pull-request
        # runs would otherwise try to push into the fork or feature branch.
        # REF_NAME is bound via env to avoid template-string injection in run:.
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ `git status --porcelain` ]]; then
            git config --global user.name 'github-actions'
            git config --global user.email 'github-actions@github.com'
            git add .github/badges/jacoco.svg
            git commit -m "chore: autogenerated JaCoCo coverage badge"
            git push origin "HEAD:${REF_NAME}"
          fi
