# ─── Application ───────────────────────────────────────────────
quarkus.application.name=securedoc

# ─── Tenant ─────────────────────────────────────────────────────
# Active organization type for this deployment. Filters the
# organization picker on /admin/register.xhtml and drives the
# user-facing label indirection in SystemConfigBean
# (orgLabel / orgLabelPlural / orgLabelLower).
# Allowed values: barangay, school, city.
securedoc.org.active-type=barangay

# ─── HTTP ───────────────────────────────────────────────────────
quarkus.http.port=8080
quarkus.http.root-path=/

# ─── Datasource (MySQL) ─────────────────────────────────────────
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=securedoc_user
quarkus.datasource.password=securedoc!123
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/securedoc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# ─── Hibernate ORM ──────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# ─── JSF / MyFaces (via quarkus-primefaces) ─────────────────────
quarkus.faces.doctype=HTML_5
quarkus.faces.project-stage=Development

# ─── Mailer (OTP delivery) ──────────────────────────────────────
# Gmail SMTP via implicit TLS on 465
# /subsystem=mail/mail-session=auth/server=smtp config (ssl=true).
# WARNING: the username/password below are committed only as defaults
# for local convenience. Rotate the app-password
# (https://myaccount.google.com/apppasswords) and prefer env vars
# (MAILER_USERNAME / MAILER_PASSWORD) before pushing to a shared
# remote — env values override the defaults at runtime.
quarkus.mailer.from=securecert7@gmail.com
quarkus.mailer.host=smtp.gmail.com
quarkus.mailer.port=465
quarkus.mailer.tls=true
quarkus.mailer.username=${MAILER_USERNAME:securecert7@gmail.com}
quarkus.mailer.password=${MAILER_PASSWORD:cupcnzcwkchpkhfo}
quarkus.mailer.mock=false

# ─── Cryptographic key paths ────────────────────────────────────
# Private keys live on disk (or KMS in prod), never in the DB.
# Public keys are also kept on disk for verifier-side checks; the
# per-organization PEM stays in `org_certificates`.
# TODO ecdsa key paths

# ─── Dev mode ───────────────────────────────────────────────────
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/securedoc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
