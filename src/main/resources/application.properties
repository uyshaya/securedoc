# -------------------------------------------------------
# Application
# -------------------------------------------------------
quarkus.application.name=securedoc
quarkus.package.jar.type=uber-jar

# -------------------------------------------------------
# SecureDoc-specific
# -------------------------------------------------------
# Active organization type for this deployment. Filters the
# organization picker on /admin/register.xhtml and drives the
# user-facing label indirection in SystemConfigBean
# (orgLabel / orgLabelPlural / orgLabelLower).
# Allowed values: barangay, school, city.
securedoc.org.active-type=barangay

# -------------------------------------------------------
# HTTP
# -------------------------------------------------------
quarkus.http.port=8080
quarkus.http.root-path=/
quarkus.http.http2=false
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.trusted-proxies=127.0.0.1

# -------------------------------------------------------
# Datasource (MySQL)
# -------------------------------------------------------
# Default-profile JDBC URL and credentials are intentionally NOT declared.
# The connection is wired three ways depending on profile:
#
#   dev   - Either Quarkus DevServices (auto-starts a mysql:8 container if
#           Docker is available) OR the local MySQL fallback below, with
#           credentials matching the `securedoc_user` provisioned by
#           src/main/resources/db/setup.sql.
#   test  - DevServices only. Container settings under %test below.
#   prod  - env vars override at runtime. Quarkus translates dotted property
#           names to SCREAMING_SNAKE_CASE for env-var lookup. For datasource:
#             quarkus.datasource.jdbc.url          -> QUARKUS_DATASOURCE_JDBC_URL
#             quarkus.datasource.username          -> QUARKUS_DATASOURCE_USERNAME
#             quarkus.datasource.password          -> QUARKUS_DATASOURCE_PASSWORD
#           See https://quarkus.io/guides/config-reference#environment-variables
#           for the full conversion rules (dot -> underscore, lowercase ->
#           uppercase, dashes preserved as underscores). Flyway and Mailer
#           env-var mappings are documented inside their respective sections.
#
#           The runtime user should be `securedoc_user` (DML-only
#           `securedoc_app` role from setup.sql). Flyway runs from a separate
#           deployment job as `securedoc_admin` (DDL-bearing
#           `securedoc_schema_admin` role) before the app boots.
quarkus.datasource.db-kind=mysql
quarkus.datasource.db-version=8
quarkus.datasource.jdbc.min-size=12
quarkus.datasource.jdbc.max-size=12

# Dev: local MySQL fallback when DevServices is unavailable (no Docker).
# Credentials match the dev `securedoc_user` provisioned by setup.sql --
# that user holds the DML-only `securedoc_app` role, the same shape it
# will have in prod. Flyway authenticates separately via the
# %dev.quarkus.flyway.* keys in the Flyway section below, so the runtime
# datasource never needs DDL privileges even in dev.
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/securedoc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
%dev.quarkus.datasource.username=securedoc_user
%dev.quarkus.datasource.password=securedoc!123

# Tests spin up a MySQL 8 container via Quarkus DevServices. Requires Docker
# on the test runner. Each test class gets a fresh container (reuse=false) so
# Flyway state and JPA validate-mode are exercised end-to-end. The image is
# pre-pulled by exec-maven-plugin's `pull-mysql-image` execution in the test
# phase so the first run doesn't time out on Docker Hub. DevServices wires
# its own root-equivalent credentials into the container; no static username
# / password keys needed under %test.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=mysql:8
%test.quarkus.datasource.devservices.reuse=false
%test.quarkus.datasource.devservices.db-name=securedoc

# -------------------------------------------------------
# Flyway (owns the schema)
# -------------------------------------------------------
# Default-profile settings work for dev and test; prod overrides via env
# vars. Migration files live on the classpath at db/migration/mysql/.
#
# Prod env-var mapping (Quarkus dotted-name -> SCREAMING_SNAKE_CASE):
#   quarkus.flyway.migrate-at-start  -> QUARKUS_FLYWAY_MIGRATE_AT_START
#   quarkus.flyway.jdbc-url          -> QUARKUS_FLYWAY_JDBC_URL
#   quarkus.flyway.username          -> QUARKUS_FLYWAY_USERNAME
#   quarkus.flyway.password          -> QUARKUS_FLYWAY_PASSWORD
#
# Prod hardening recipe: set QUARKUS_FLYWAY_MIGRATE_AT_START=false so the
# app doesn't auto-migrate at boot, then run Flyway as part of the deploy
# job (either Quarkus' embedded Flyway with QUARKUS_FLYWAY_JDBC_URL +
# QUARKUS_FLYWAY_USERNAME + QUARKUS_FLYWAY_PASSWORD pointing at the
# `securedoc_admin` user, or the Flyway CLI invoked directly). The runtime
# Quarkus app then connects as `securedoc_user` (DML-only `securedoc_app`
# role) and a checksum mismatch at boot can't drop tables -- the runtime
# datasource doesn't have the privileges.
quarkus.flyway.locations=db/migration/mysql
quarkus.flyway.migrate-at-start=true

%dev.quarkus.flyway.jdbc-url=jdbc:mysql://localhost:3306/securedoc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
%dev.quarkus.flyway.username=securedoc_admin
%dev.quarkus.flyway.password=securedoc_admin!CHANGEME_dev_only

# -------------------------------------------------------
# Hibernate ORM
# -------------------------------------------------------
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.schema-management.halt-on-error=true
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.fetch.batch-size=25
quarkus.hibernate-orm.jdbc.statement-batch-size=25
quarkus.hibernate-orm.jdbc.statement-fetch-size=25
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.log.highlight-sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.log.queries-slower-than-ms=1000
quarkus.hibernate-orm.log.jdbc-warnings=true
quarkus.hibernate-orm.request-scoped.enabled=false
quarkus.hibernate-orm.second-level-caching-enabled=false

%dev.quarkus.hibernate-orm.log.sql=true
%test.quarkus.hibernate-orm.log.sql=true

# -------------------------------------------------------
# JSF / MyFaces / PrimeFaces
# -------------------------------------------------------
# Configuration is set via web.xml context-params
# (jakarta.faces.PROJECT_STAGE, primefaces.THEME, ...). No Quarkus
# properties surface for those today; this section exists so a future
# Quarkus-managed JSF property has an obvious home.

# -------------------------------------------------------
# Mailer (OTP delivery)
# -------------------------------------------------------
# Gmail SMTP via implicit TLS on 465. The username/password committed below
# are dev/local-convenience defaults; rotate the app-password
# (https://myaccount.google.com/apppasswords) and override the credentials
# via env vars before pushing to a shared remote.
#
# Prod env-var mapping (Quarkus dotted-name -> SCREAMING_SNAKE_CASE):
#   quarkus.mailer.from      -> QUARKUS_MAILER_FROM
#   quarkus.mailer.host      -> QUARKUS_MAILER_HOST
#   quarkus.mailer.port      -> QUARKUS_MAILER_PORT
#   quarkus.mailer.tls       -> QUARKUS_MAILER_TLS
#   quarkus.mailer.username  -> QUARKUS_MAILER_USERNAME
#   quarkus.mailer.password  -> QUARKUS_MAILER_PASSWORD
#   quarkus.mailer.mock      -> QUARKUS_MAILER_MOCK
# Any env var present at boot wins over the value declared here; the dev
# defaults are just fallbacks for an empty environment.
quarkus.mailer.from=securecert7@gmail.com
quarkus.mailer.host=smtp.gmail.com
quarkus.mailer.port=465
quarkus.mailer.tls=true
quarkus.mailer.username=securecert7@gmail.com
quarkus.mailer.password=cupcnzcwkchpkhfo
quarkus.mailer.mock=false

# -------------------------------------------------------
# Cryptographic key paths
# -------------------------------------------------------
# Private keys live on disk (or KMS in prod), never in the DB.
# Public keys are also kept on disk for verifier-side checks; the
# per-organization PEM stays in `org_certificates`.
# TODO ecdsa key paths

# -------------------------------------------------------
# Misc
# -------------------------------------------------------
quarkus.test.profile=test
quarkus.log.console.darken=1

%dev.quarkus.log.min-level=TRACE
%test.quarkus.jacoco.report=true