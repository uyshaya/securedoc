# ─── Application ───────────────────────────────────────────────
quarkus.application.name=securedoc

# ─── HTTP ───────────────────────────────────────────────────────
quarkus.http.port=8080
quarkus.http.root-path=/

# ─── Datasource (MySQL) ─────────────────────────────────────────
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=securedoc_user
quarkus.datasource.password=securedoc!123
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/securedoc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# ─── Hibernate ORM ──────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# ─── JSF / MyFaces (via quarkus-primefaces) ─────────────────────
quarkus.faces.doctype=HTML_5
quarkus.faces.project-stage=Development

# ─── Cryptographic key paths ────────────────────────────────────
# Private keys live on disk (or KMS in prod), never in the DB.
# Public keys are also kept on disk for verifier-side checks; the
# per-barangay PEM stays in `org_certificates`.
# TODO ecdsa key paths

# ─── Dev mode ───────────────────────────────────────────────────
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/securedoc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
