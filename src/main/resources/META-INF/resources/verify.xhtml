<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/verify-layout.xhtml">

    <ui:define name="pageTitle">
        <title>#{msg['layout.verifier.title']}</title>
    </ui:define>

    <ui:define name="content">

        <div>
            <div class="sec-title">#{msg['verify.section.title']}</div>
            <div class="sec-sub">#{msg['verify.section.sub']}</div>
        </div>

        <div class="verify-options">

            <button type="button" class="verify-option">
                <span class="verify-option-letter">#{msg['verify.option.a.label']}</span>
                <span class="verify-option-body">
                    <span class="verify-option-eyebrow">#{msg['verify.option.a.eyebrow']}</span>
                    <span class="verify-option-title">#{msg['verify.option.a.title']}</span>
                    <span class="portal-desc">#{msg['verify.option.a.desc']}</span>
                </span>
                <span class="verify-option-arrow">
                    <i class="pi pi-angle-right"></i>
                </span>
            </button>

            <button type="button" class="verify-option">
                <span class="verify-option-letter">#{msg['verify.option.b.label']}</span>
                <span class="verify-option-body">
                    <span class="verify-option-eyebrow">#{msg['verify.option.b.eyebrow']}</span>
                    <span class="verify-option-title">#{msg['verify.option.b.title']}</span>
                    <span class="portal-desc">#{msg['verify.option.b.desc']}</span>
                </span>
                <span class="verify-option-arrow">
                    <i class="pi pi-angle-right"></i>
                </span>
            </button>

        </div>

    </ui:define>

</ui:composition>
