<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      lang="en">

<h:head>
    <f:facet name="first">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </f:facet>
    <title>#{msg['layout.resident.title']}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&amp;display=swap"
          rel="stylesheet"/>

    <h:outputStylesheet>
        <h:outputStylesheet library="css" name="global.css"/>
    </h:outputStylesheet>
</h:head>

<h:body>
    <div class="scene">

        <!-- == Brand == -->
        <div class="brand">
            <div class="brand-icon">
                <!-- Shield + check mark -->
                <svg width="34" height="34" viewBox="0 0 28 28" fill="none"
                     xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 3L5 7V14C5 18.97 9.02 23.57 14 24.93C18.98 23.57 23 18.97 23 14V7L14 3Z"
                          fill="#fff"/>
                    <path d="M9.5 14L12.5 17L18.5 11"
                          stroke="#0C3B6E" stroke-width="2.2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div>
                <div class="brand-name">#{msg['app.brand.prefix']}<em>#{msg['app.brand.suffix']}</em></div>
                <div class="brand-tagline">#{msg['index.brand.tagline']}</div>
            </div>
        </div>

        <!-- == Main portal cards == -->
        <div class="portal-grid">

            <!-- Verifier -->
            <h:link styleClass="portal-card verifier" outcome="/verify">
                <div class="portal-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                         xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L4 6v7c0 4.97 3.6 9.63 8 10.93C16.4 22.63 20 17.97 20 13V6l-8-4z"
                              stroke="#1A7A45" stroke-width="1.6" stroke-linejoin="round"/>
                        <path d="M9 12l2.5 2.5L15 10"
                              stroke="#1A7A45" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="portal-body">
                    <div class="portal-eyebrow">#{msg['index.verifier.eyebrow']}</div>
                    <div class="portal-title">#{msg['index.verifier.title']}</div>
                    <div class="portal-desc">#{msg['index.verifier.desc']}</div>
                    <div class="portal-badge">
                        #{msg['index.verifier.badge']}
                    </div>
                </div>
                <div class="portal-arrow">
                    <i class="pi pi-angle-right"></i>
                </div>
            </h:link>

        </div>

        <!-- == Footer == -->
        <div class="footer">#{msg['app.copyright']}</div>

    </div>
</h:body>
</html>
