<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/admin-auth-layout.xhtml">

    <f:metadata>
        <f:viewParam name="slug" value="#{registerBean.urlSlug}"/>
        <f:viewAction action="#{registerBean.initRegisterFromUrl}" onPostback="false"/>
    </f:metadata>

    <ui:define name="pageTitle">
        <title>#{msg['page.register.title']}</title>
    </ui:define>

    <ui:define name="formContent">
        <h:form id="registerForm">

            <!-- JSF's <f:viewParam> does not round-trip into form action URLs,
                 only into bookmarkable links. The postback needs the slug
                 so the filter can resolve the tenant on submit. -->
            <input type="hidden" name="slug" value="#{registerBean.urlSlug}"/>

            <p:outputPanel id="registerPanel"
                           layout="block"
                           styleClass="auth-panel">

                <div>
                    <div class="auth-step-title">#{msg['register.step.title']}</div>
                    <div class="auth-step-sub">
                        #{msg['register.step.sub']}
                    </div>
                </div>

                <h:panelGroup layout="block"
                              styleClass="af-tenant-banner"
                              rendered="#{registerBean.pinnedOrganization ne null}">
                    #{i18n.get('register.org.pinned.label', registerBean.pinnedOrganization.name)}
                </h:panelGroup>

                <p:outputLabel for="firstName"
                               styleClass="af-label"
                               value="#{msg['register.label.first.name']}"/>
                <p:inputText id="firstName"
                             value="#{registerBean.firstName}"
                             placeholder="#{msg['register.placeholder.first.name']}"
                             styleClass="ui-inputfield"
                             required="true"
                             requiredMessage="#{msg['register.required.first.name']}"/>
                <p:message for="firstName"/>

                <p:outputLabel for="lastName"
                               styleClass="af-label"
                               value="#{msg['register.label.last.name']}"/>
                <p:inputText id="lastName"
                             value="#{registerBean.lastName}"
                             placeholder="#{msg['register.placeholder.last.name']}"
                             styleClass="ui-inputfield"
                             required="true"
                             requiredMessage="#{msg['register.required.last.name']}"/>
                <p:message for="lastName"/>

                <p:outputLabel for="email"
                               styleClass="af-label"
                               value="#{msg['register.label.email']}"/>
                <p:inputText id="email"
                             value="#{registerBean.email}"
                             type="email"
                             placeholder="#{msg['register.placeholder.email']}"
                             styleClass="ui-inputfield"
                             required="true"
                             requiredMessage="#{msg['register.required.email']}"/>
                <p:message for="email"/>

                <p:outputLabel for="password"
                               styleClass="af-label"
                               value="#{msg['register.label.password']}"/>
                <p:password id="password"
                            value="#{registerBean.password}"
                            placeholder="********"
                            feedback="false"
                            toggleMask="true"
                            styleClass="ui-inputfield"
                            required="true"
                            requiredMessage="#{msg['register.required.password']}"/>
                <p:message for="password"/>

                <p:outputLabel for="confirmPassword"
                               styleClass="af-label"
                               value="#{msg['register.label.confirm.password']}"/>
                <p:password id="confirmPassword"
                            value="#{registerBean.confirmPassword}"
                            placeholder="********"
                            feedback="false"
                            toggleMask="true"
                            styleClass="ui-inputfield"
                            required="true"
                            requiredMessage="#{msg['register.required.confirm.password']}"/>
                <p:message for="confirmPassword"/>

                <p:messages globalOnly="true"
                            showSummary="true"
                            showDetail="false"/>

                <p:commandButton value="#{msg['register.button.create']}"
                                 styleClass="af-btn"
                                 action="#{registerBean.register}"
                                 update="registerForm"
                                 process="@form"/>

                <div class="auth-footer-link">
                    #{msg['register.footer.have.account']}&#160;
                    <h:link outcome="login">#{msg['register.footer.signin']}</h:link>
                </div>

            </p:outputPanel>

        </h:form>
    </ui:define>

</ui:composition>
