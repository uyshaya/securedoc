<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/admin-layout.xhtml">

    <ui:define name="pageTitle">
        <title>#{msg['page.templates.title']}</title>
    </ui:define>

    <ui:define name="pageHeader">
        <h1 class="console-page-title">#{msg['page.templates.heading']}</h1>
    </ui:define>

    <ui:define name="content">

        <p:messages globalOnly="true" showSummary="true" showDetail="false"/>

        <!-- == Upload card == -->
        <h:form id="uploadForm" enctype="multipart/form-data">
            <p:card styleClass="template-upload-card">
                <f:facet name="title">#{msg['template.upload.card.title']}</f:facet>
                <f:facet name="subtitle">
                    #{i18n.get('template.upload.card.subtitle', systemConfigBean.orgLabelLower)}
                </f:facet>

                <div class="template-upload-grid">
                    <div class="fwrap">
                        <p:outputLabel for="templateName" value="#{msg['template.field.name']}"/>
                        <p:inputText id="templateName"
                                     value="#{templateManagementBean.newName}"
                                     placeholder="#{msg['template.field.name.placeholder']}"/>
                    </div>

                    <div class="fwrap">
                        <p:outputLabel for="templateDocType" value="#{msg['template.field.doctype']}"/>
                        <p:selectOneMenu id="templateDocType"
                                         value="#{templateManagementBean.newDocType}">
                            <f:selectItem itemValue="#{null}"
                                          itemLabel="#{msg['template.field.doctype.placeholder']}"
                                          noSelectionOption="true"/>
                            <f:selectItems value="#{templateManagementBean.docTypeOptions}"/>
                        </p:selectOneMenu>
                    </div>

                    <div class="fwrap template-full-row">
                        <p:outputLabel for="templateDescription" value="#{msg['template.field.description']}"/>
                        <p:inputTextarea id="templateDescription"
                                         value="#{templateManagementBean.newDescription}"
                                         rows="2"
                                         placeholder="#{msg['template.field.description.placeholder']}"/>
                    </div>
                </div>

                <f:facet name="footer">
                    <p:fileUpload id="templateFile"
                                  value="#{templateManagementBean.newFile}"
                                  mode="simple"
                                  skinSimple="true"
                                  accept="application/pdf,.pdf"
                                  chooseIcon="pi pi-cloud-upload"
                                  label="#{msg['template.button.choose.pdf']}"/>
                    <p:commandButton value="#{msg['template.button.save']}"
                                     icon="pi pi-save"
                                     action="#{templateManagementBean.upload}"
                                     ajax="false"
                                     styleClass="btn-template-primary"/>
                </f:facet>
            </p:card>
        </h:form>

        <!-- == Templates table == -->
        <h:form id="templateListForm">
            <p:dataTable id="templateTable"
                         value="#{templateManagementBean.templates}"
                         var="template"
                         emptyMessage="#{i18n.get('template.table.empty', systemConfigBean.orgLabelLower)}">

                <p:column headerText="#{msg['template.column.name']}">
                    <h:outputText value="#{template.name}" style="font-weight:500"/>
                </p:column>

                <p:column headerText="#{msg['template.column.doctype']}">
                    <h:outputText value="#{templateManagementBean.labelOf(template.docType)}"/>
                </p:column>

                <p:column headerText="#{msg['template.column.description']}">
                    <h:outputText value="#{empty template.description ? '—' : template.description}"
                                  style="color:var(--tx-m)"/>
                </p:column>

                <p:column headerText="#{msg['template.column.uploaded']}" style="white-space:nowrap">
                    <time datetime="#{template.createdAt}" class="local-time" data-format="date">
                        <h:outputText value="#{template.createdAt}"/>
                    </time>
                </p:column>

                <p:column headerText="#{msg['template.column.actions']}" style="white-space:nowrap;width:220px">
                    <p:button href="#{request.contextPath}/admin/templates/preview?id=#{template.id}"
                              target="_blank"
                              value="#{msg['template.button.preview']}"
                              icon="pi pi-eye"
                              styleClass="ui-button-flat"/>

                    <p:commandButton value="#{msg['template.button.delete']}"
                                     action="#{templateManagementBean.deleteTemplate(template)}"
                                     update="templateListForm"
                                     process="@this"
                                     styleClass="ui-button-flat">
                        <p:confirm header="#{msg['template.confirm.delete.header']}"
                                   message="#{i18n.get('template.confirm.delete.message', template.name)}"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </h:form>

        <!-- Global confirm dialog wired by <p:confirm> delete button -->
        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true">
            <p:commandButton value="#{msg['template.button.delete']}"
                             type="button"
                             styleClass="ui-confirmdialog-yes"/>
            <p:commandButton value="#{msg['common.cancel']}"
                             type="button"
                             styleClass="ui-button-flat ui-confirmdialog-no"/>
        </p:confirmDialog>

    </ui:define>

</ui:composition>
