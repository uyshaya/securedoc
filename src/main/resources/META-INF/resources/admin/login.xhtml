<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/admin-auth-layout.xhtml">

    <ui:define name="pageTitle">
        <title>Sign In – SecureDoc Admin</title>
    </ui:define>

    <ui:define name="formContent">
        <h:form id="loginForm">

            <!-- ══ Sign-in panel ══ -->
            <p:outputPanel id="signinPanel"
                           rendered="#{not authBean.otpSent}"
                           layout="block"
                           styleClass="auth-panel">

                <div>
                    <div class="auth-step-title">Sign in</div>
                    <div class="auth-step-sub">
                        Enter your admin credentials to continue.
                    </div>
                </div>

                <p:outputLabel for="email"
                               styleClass="af-label"
                               value="Email address"/>
                <p:inputText id="email"
                             value="#{authBean.email}"
                             type="email"
                             placeholder="admin@securedoc.gov.ph"
                             styleClass="ui-inputfield"/>

                <p:outputLabel for="password"
                               styleClass="af-label"
                               value="Password"/>
                <p:password id="password"
                            value="#{authBean.password}"
                            placeholder="••••••••"
                            feedback="false"
                            toggleMask="true"
                            styleClass="ui-inputfield"/>

                <p:messages globalOnly="true"
                            showSummary="true"
                            showDetail="false"/>

                <p:commandButton value="Continue"
                                 styleClass="af-btn"
                                 iconPos="right"
                                 action="#{authBean.signIn}"
                                 update="loginForm"
                                 process="@form"/>

                <div class="auth-footer-link">
                    Don't have an account?&#160;
                    <h:link outcome="register">Create one</h:link>
                </div>

            </p:outputPanel>

            <!-- ══ OTP panel ══ -->
            <p:outputPanel id="otpPanel"
                           rendered="#{authBean.otpSent}"
                           layout="block"
                           styleClass="auth-panel">

                <div>
                    <p:commandButton styleClass="auth-back-link"
                                     icon="pi pi-angle-left"
                                     value="Back"
                                     action="#{authBean.cancelOtp}"
                                     update="loginForm"
                                     ajax="true"
                                     immediate="true"/>
                    <div class="auth-step-title">Verify it's you</div>
                    <div class="auth-step-sub">
                        We sent a 6-digit code to
                        <strong style="color:var(--navy)">
                            <h:outputText value="#{authBean.email}"/>
                        </strong>.
                        Enter it below to continue.
                    </div>
                </div>

                <div class="otp-row">
                    <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]"/>
                    <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]"/>
                    <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]"/>
                    <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]"/>
                    <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]"/>
                    <input type="text" class="otp-cell" maxlength="1" inputmode="numeric" pattern="[0-9]"/>
                </div>
                <h:inputHidden id="otpInput" value="#{authBean.otpInput}"/>
                <p:messages globalOnly="true"
                            showSummary="true"
                            showDetail="false"/>

                <script>
                    //<![CDATA[
                    (function () {
                        var cells = document.querySelectorAll('#loginForm .otp-cell');
                        var hidden = document.getElementById('loginForm:otpInput');
                        if (!cells.length || !hidden) return;

                        function sync() {
                            hidden.value = Array.prototype.map.call(cells, function (c) { return c.value || ''; }).join('');
                        }

                        Array.prototype.forEach.call(cells, function (c, i) {
                            c.addEventListener('input', function (e) {
                                var v = e.target.value.replace(/\D/g, '');
                                c.value = v ? v.slice(-1) : '';
                                if (c.value) {
                                    c.classList.add('filled');
                                    if (i < cells.length - 1) cells[i + 1].focus();
                                } else {
                                    c.classList.remove('filled');
                                }
                                sync();
                            });
                            c.addEventListener('keydown', function (e) {
                                if (e.key === 'Backspace' && !c.value && i > 0) cells[i - 1].focus();
                                if (e.key === 'ArrowLeft' && i > 0) cells[i - 1].focus();
                                if (e.key === 'ArrowRight' && i < cells.length - 1) cells[i + 1].focus();
                            });
                            c.addEventListener('paste', function (e) {
                                e.preventDefault();
                                var pasted = (e.clipboardData || window.clipboardData).getData('text')
                                    .replace(/\D/g, '').slice(0, cells.length);
                                for (var j = 0; j < pasted.length; j++) {
                                    cells[j].value = pasted[j];
                                    cells[j].classList.add('filled');
                                }
                                sync();
                                if (pasted.length > 0) {
                                    cells[Math.min(pasted.length, cells.length - 1)].focus();
                                }
                            });
                        });
                    })();
                    //]]>
                </script>

                <div class="otp-resend">
                    Didn't receive it?&#160;
                    <p:commandButton value="Resend code"
                                     style="background:none;border:none;
                                        color:var(--navy-mid);font-weight:500;
                                        font-size:12px;text-decoration:underline;
                                        cursor:pointer;padding:0"
                                     action="#{authBean.resendOtp}"
                                     update="loginForm"
                                     immediate="true"
                                     ajax="true"/>
                </div>

                <p:commandButton value="Verify &amp; Sign In"
                                 styleClass="af-btn"
                                 action="#{authBean.verifyOtp}"
                                 update="loginForm"
                                 process="@form"/>

            </p:outputPanel>

        </h:form>
    </ui:define>

</ui:composition>
