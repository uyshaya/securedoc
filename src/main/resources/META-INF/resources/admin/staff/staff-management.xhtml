<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/admin-layout.xhtml">

    <ui:define name="pageTitle">
        <title>#{msg['page.staff.title']}</title>
    </ui:define>

    <ui:define name="pageHeader">
        <h1 class="console-page-title">#{msg['page.staff.heading']}</h1>
    </ui:define>

    <ui:define name="content">

        <p:messages globalOnly="true" showSummary="true" showDetail="false" closable="true"/>

        <h:form id="staffForm">

            <p:dataTable id="staffTable"
                         value="#{staffManagementBean.staffList}"
                         var="s"
                         emptyMessage="#{i18n.get('staff.table.empty', systemConfigBean.orgLabelLower)}">

                <p:column headerText="#{msg['staff.column.name']}">
                    <h:outputText value="#{s.fullName}"/>
                </p:column>

                <p:column headerText="#{msg['staff.column.email']}">
                    <h:outputText value="#{s.email}"/>
                </p:column>

                <p:column headerText="#{msg['staff.column.last.login']}">
                    <h:panelGroup rendered="#{s.lastLogin != null}">
                        <time datetime="#{s.lastLogin}" class="local-time" data-format="relative">
                            <h:outputText value="#{s.lastLogin}"/>
                        </time>
                    </h:panelGroup>
                    <h:outputText value="#{msg['staff.last.login.never']}" rendered="#{s.lastLogin == null}"/>
                </p:column>

                <p:column headerText="#{msg['staff.column.role']}">
                    <p:selectOneMenu value="#{s.role}"
                                     disabled="#{s.id == authBean.authenticatedId}">
                        <f:selectItems value="#{staffManagementBean.roleOptions}"/>
                        <p:ajax listener="#{staffManagementBean.changeRole(s)}"
                                update="staffForm"/>
                    </p:selectOneMenu>
                </p:column>

                <p:column headerText="#{msg['staff.column.status']}">
                    <h:outputText value="#{s.active ? msg['staff.status.active'] : msg['staff.status.inactive']}"
                                  style="color:#{s.active ? 'var(--green)' : 'var(--tx-m)'}"/>
                </p:column>

                <p:column headerText="#{msg['staff.column.actions']}" style="white-space:nowrap">
                    <p:commandButton value="#{s.active ? msg['staff.action.deactivate'] : msg['staff.action.approve']}"
                                     action="#{staffManagementBean.toggleActive(s)}"
                                     update="staffForm"
                                     process="@this"
                                     icon="#{s.active ? 'pi pi-ban' : 'pi pi-check'}"
                                     styleClass="ui-button-flat"/>

                    <p:commandButton value="#{msg['staff.action.delete']}"
                                     action="#{staffManagementBean.deleteStaff(s)}"
                                     update="staffForm"
                                     process="@this"
                                     icon="pi pi-trash"
                                     styleClass="ui-button-flat"
                                     rendered="#{s.id != authBean.authenticatedId}"
                                     onclick="return confirm('#{i18n.get('staff.action.delete.confirm', s.fullName)}');"/>
                </p:column>
            </p:dataTable>

        </h:form>

    </ui:define>

</ui:composition>
